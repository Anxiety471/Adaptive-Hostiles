name: Core tests

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run dependency-free core tests
        run: dotnet run --project Tests/AdaptiveHostiles.Tests/AdaptiveHostiles.Tests.csproj --configuration Release
